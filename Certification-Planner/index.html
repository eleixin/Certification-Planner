<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="数字认证项目计划工具 - Certification Planner">
  <title>Certification Planner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/index.css?v=27">
  <link rel="stylesheet" href="css/gantt.css?v=27">
  <link rel="stylesheet" href="css/modal.css?v=27">
</head>
<body>
  <div class="app-container">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-row toolbar-row-top">
        <h1>📋 Certification Planner</h1>
        <div class="toolbar-actions">
          <button class="btn btn-primary" id="btn-add">+ 新增项目</button>
          <div class="toolbar-divider"></div>
          <div class="global-ready-group">
            <label for="input-global-ready">Global Ready</label>
            <input type="week" id="input-global-ready" />
            <button class="btn btn-accent" id="btn-apply-global-ready" title="将此 Ready Week 应用到所有项目">Apply All</button>
          </div>
          <div class="toolbar-divider"></div>
          <button class="btn btn-secondary" id="btn-export-excel">📊 Excel</button>
          <button class="btn btn-secondary" id="btn-export-json">💾 JSON</button>
          <button class="btn btn-secondary" id="btn-import-json">📂 导入</button>
          <button class="btn btn-secondary" id="btn-save-default" title="把当前界面所有数据设为默认基线，后续点【重置】均恢复至此状态">📌 设为默认</button>
          <button class="btn btn-secondary" id="btn-reset" title="恢复至默认设定的认证项目数据">🔄 重置</button>
          <input type="file" id="file-import" accept=".json" hidden />
        </div>
      </div>
      <div class="toolbar-row toolbar-row-legend">
        <div class="legend" id="legend">
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-ready)"></div> Ready (软硬件就绪)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-iv)"></div> IV (预测试)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-iv-pass)"></div> IV Pass (预测试通过)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-fixing)"></div> Fixing (缺陷修复)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-dhl)"></div> DHL (样机寄送)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-official)"></div> Official (官方测试)</div>
          <div class="legend-item"><div class="legend-color" style="background-color: var(--phase-pass)"></div> Pass (正式通过)</div>
        </div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="content-area">
      <!-- 顶部固定表头层 (90px) -->
      <div class="gantt-sticky-header">
        <div class="project-info-header">
          <div class="col col-no" title="序号">#</div>
          <div class="col col-region">Region</div>
          <div class="col col-operator" title="认证类型 / 运营商 (Certification Type)">Cert Type</div>
          <div class="col col-period">Period</div>
          <div class="col col-dvt" title="DVT 样机数量 (DVT Sample Quantity)">DVT Qty</div>
          <div class="col col-pvt" title="PVT 样机数量 (PVT Sample Quantity)">PVT Qty</div>
        </div>
        <div class="gantt-header-container" id="gantt-header-container">
          <div class="gantt-header" id="gantt-header"><!-- 年/月/周表头 --></div>
        </div>
      </div>

      <!-- 主体滚动层 (单一原生垂直滚动容器，左右行 100% 绝对对齐) -->
      <div class="gantt-scroll-body" id="gantt-scroll-body">
        <div class="project-info-sticky" id="project-info-sticky">
          <div class="data-rows" id="project-rows"><!-- 动态左侧项目列 --></div>
        </div>
        <div class="gantt-body-container" id="gantt-body-container">
          <div class="gantt-body" id="gantt-body"><!-- 动态右侧甘特图行 --></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">新增认证项目</h2>
        <button class="btn-close" id="btn-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="project-form">
          <div class="form-row">
            <div class="form-group">
              <label for="input-region">Region</label>
              <select id="input-region">
                <option>Common</option>
                <option>UK</option>
                <option>Germany</option>
                <option>Netherlands</option>
                <option>Italy</option>
                <option>Poland</option>
                <option>France</option>
                <option>Spain</option>
              </select>
            </div>
            <div class="form-group">
              <label for="input-operator">Cert Type</label>
              <input type="text" id="input-operator" placeholder="如 HDMI, BBC..." />
            </div>
            <div class="form-group">
              <label for="input-period">Period (自动计算总周期)</label>
              <input type="text" id="input-period" placeholder="自动计算" readonly style="opacity:0.7; cursor:not-allowed;" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="input-dvt">DVT 样机数量 (台)</label>
              <input type="number" id="input-dvt" min="0" value="0" />
            </div>
            <div class="form-group">
              <label for="input-pvt">PVT 样机数量 (台)</label>
              <input type="number" id="input-pvt" min="0" value="0" />
            </div>
            <div class="form-group">
              <label for="input-ready-week">Ready Week (就绪周次)</label>
              <input type="week" id="input-ready-week" />
            </div>
          </div>
          <div class="form-row" id="insert-pos-row">
            <div class="form-group" style="flex: 1;">
              <label for="input-insert-pos">新增项目插入位置</label>
              <select id="input-insert-pos">
                <option value="after-selected">插入在选中的行下方</option>
                <option value="end">插入在列表末尾</option>
              </select>
            </div>
          </div>

          <!-- IV 配置 -->
          <div class="form-section">
            <h3>IV (Internal Verification) 配置</h3>
            <div class="form-row">
              <div class="form-group">
                <label for="input-iv-rounds">IV 轮次</label>
                <select id="input-iv-rounds">
                  <option value="0">0 轮 (不启用 IV)</option>
                  <option value="1">1 轮</option>
                  <option value="2">2 轮</option>
                  <option value="3">3 轮</option>
                  <option value="4">4 轮</option>
                  <option value="5">5 轮</option>
                </select>
              </div>
            </div>
            <div id="iv-rounds-config" class="rounds-config">
              <!-- 动态生成每轮配置 -->
            </div>
          </div>

          <!-- DHL 配置 -->
          <div class="form-section">
            <h3>DHL Shipping 配置</h3>
            <div class="form-row">
              <div class="form-group">
                <label>启用 DHL 寄样</label>
                <label class="toggle-switch">
                  <input type="checkbox" id="input-dhl-enable" />
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <div class="form-group" id="dhl-weeks-group" style="display:none">
                <label for="input-dhl-weeks">DHL 寄样周数</label>
                <input type="number" id="input-dhl-weeks" min="1" value="1" />
              </div>
            </div>
          </div>

          <!-- Official 配置 -->
          <div class="form-section">
            <h3>Official Testing 配置</h3>
            <div class="form-row">
              <div class="form-group">
                <label for="input-off-rounds">Official 轮次</label>
                <select id="input-off-rounds">
                  <option value="0">0 轮 (不启用 Official)</option>
                  <option value="1">1 轮</option>
                  <option value="2">2 轮</option>
                  <option value="3">3 轮</option>
                  <option value="4">4 轮</option>
                  <option value="5">5 轮</option>
                </select>
              </div>
            </div>
            <div id="off-rounds-config" class="rounds-config">
              <!-- 动态生成每轮配置 -->
            </div>
          </div>

          <!-- 统计与预览区 -->
          <div class="form-section schedule-summary-section">
            <h3>排期预览</h3>
            <div id="schedule-summary-box" class="schedule-summary-box">
              <span id="summary-total-weeks">总计: 0 周</span>
              <span id="summary-date-range">周期: -</span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="btn-delete" style="display:none">删除</button>
        <div class="footer-right">
          <button class="btn btn-secondary" id="btn-cancel">取消</button>
          <button class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 核心逻辑脚本（优先加载，不受外网 CDN 网络阻塞） -->
  <script src="js/data.js?v=57"></script>
  <script src="js/scheduler.js?v=57"></script>
  <script src="js/storage.js?v=57"></script>
  <script src="js/gantt.js?v=57"></script>
  <script src="js/excel.js?v=57"></script>
  <script src="js/app.js?v=57"></script>

  <!-- Excel 导出第三方库（异步按需，即使网络挂掉也不影响甘特图显示） -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js" defer></script>
</body>
</html>
